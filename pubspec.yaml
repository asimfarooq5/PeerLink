name: peerlink
description: PeerLink - A secure peer-to-peer messaging app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # WebRTC for P2P communication
  flutter_webrtc: ^0.12.1
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.10
  
  # Social authentication
  google_sign_in: ^6.1.6
  flutter_facebook_auth: ^7.0.0
  
  # Local storage with encryption
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  encrypt: ^5.0.1
  crypto: ^3.0.3
  
  # Security features
  local_auth: ^2.1.8
  sensors_plus: ^7.0.0
  flutter_screen_lock: ^9.0.2
  
  # File handling
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  
  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # UI utilities
  flutter_contacts: ^1.1.7+1
  share_plus: ^7.2.1
  flutter_local_notifications: ^17.0.0
  intl: ^0.18.1
  cached_network_image: ^3.3.0
  video_player: ^2.8.1
  chewie: ^1.7.1
  
  # Utilities
  uuid: ^4.2.2
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  wakelock_plus: ^1.1.4

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
